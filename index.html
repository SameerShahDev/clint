<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Suspended | Action Required</title>
    <style>
        * { margin: 0; padding: 0; box-box: border-box; }
        body { 
            background-color: #0a0a0a; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .payment-card {
            background: #111;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(255, 171, 0, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            color: #ffab00;
            font-size: 40px;
            animation: pulse 2s infinite;
        }

        h1 { font-size: 24px; margin-bottom: 10px; color: #fff; }
        p { color: #888; line-height: 1.6; margin-bottom: 30px; font-size: 15px; }

        .btn-pay {
            background: #fff;
            color: #000;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-pay:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .status-tag {
            font-size: 10px;
            letter-spacing: 2px;
            color: #ffab00;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 171, 0, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 171, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 171, 0, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="payment-card">
        <span class="status-tag">Status: Pending Activation</span>
        <div class="icon-box">💳</div>
        <h1>Complete Your Payment</h1>
        <p>Your professional portfolio service has been temporarily paused. Please complete the pending payment to restore full access and go live.</p>
        
        <a href="https://wa.me/YOUR_NUMBER" class="btn-pay">Contact Developer</a>
    </div>

</body>
</html>
