<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted | Aryan VFX</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ff3e3e; /* Dramatic Red */
            --glow-color: rgba(255, 62, 62, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .lock-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .lock-icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: var(--accent-color);
            animation: pulse 2s infinite, glow 3s infinite alternate;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 16px;
            color: #aaaaaa;
            margin: 0 0 40px;
        }

        .action-required-tag {
            background-color: var(--accent-color);
            color: black;
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        input[type="password"] {
            background-color: #111;
            border: 2px solid #333;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            width: 280px;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--glow-color);
        }

        button.submit-btn {
            background-color: transparent;
            border: 2px solid #333;
            color: #aaaaaa;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button.submit-btn:hover {
            border-color: var(--accent-color);
            color: white;
            box-shadow: 0 0 10px var(--glow-color);
        }

        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(30, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 70%);
            z-index: 1;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(255, 62, 62, 0); }
            100% { text-shadow: 0 0 25px rgba(255, 62, 62, 1); }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="lock-container">
        <div class="lock-icon">🔒</div>
        <div class="action-required-tag">ACTION REQUIRED</div>
        <h1>Owner Action Required</h1>
        <p>This section is restricted. Unlock to proceed.</p>
        <form action="#" method="post" onsubmit="checkPassword(event)">
            <input type="password" id="password" placeholder="Enter Access Code" required>
            <button type="submit" class="submit-btn">Unlock</button>
        </form>
    </div>

    <script>
        // Placeholder check function - Aryan himself needs this part!
        function checkPassword(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            // The password is set to 'AryanVFX123' for now
            if (password === 'AryanVFX123') {
                // If correct, redirect to main portfolio page or show content
                alert('Access Granted! Redirecting...');
                window.location.href = 'index.html'; // Adjust this URL as needed!
            } else {
                alert('Invalid Code. Please try again or contact the owner.');
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
